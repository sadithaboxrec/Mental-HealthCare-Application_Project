name: mental_health_support_app
description: "MindCare — Mental Healthcare & Digital Phenotyping App"
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.4

  # Location & Storage
  geolocator: ^13.0.2
  shared_preferences: ^2.3.2

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Design & Icons
  phosphor_flutter: ^2.1.0
  google_fonts: ^6.2.1

  # Data Visualization
  fl_chart: ^0.69.0

  # Animations & UX
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.19.0
  http: ^1.2.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/illustrations/
    - assets/onboarding/
    - assets/states/

