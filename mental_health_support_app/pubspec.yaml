name: mental_health_support_app
description: "MindCare — Mental Healthcare & Digital Phenotyping App"
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.4

  # Location and local storage
  geolocator: ^13.0.2
  shared_preferences: ^2.3.2

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # UI
  phosphor_flutter: ^2.1.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  fl_chart: ^0.69.0
  shimmer: ^3.0.0

  # Networking and utilities
  http: ^1.2.1
  intl: ^0.19.0

  # Used by ApiService to read the device WiFi IP for backend URL discovery.
  # See lib/core/services/api_service.dart
  network_info_plus: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generates launcher icons from assets/brand/mindcare_logo.png.
  # Run: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.3

  # FlutterFire CLI is installed as a global Dart tool, not a project dependency.
  # Install: dart pub global activate flutterfire_cli
  # Run:     flutterfire configure --project=<firebase-project-id>

# Launcher icon configuration
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/brand/mindcare_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/brand/mindcare_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/illustrations/
    - assets/onboarding/
    - assets/states/
