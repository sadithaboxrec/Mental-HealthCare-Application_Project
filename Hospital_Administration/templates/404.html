{% extends "base.html" %}

{% block title %}Not Found — MindCare Admin{% endblock %}
{% block page_title %}Page Not Found{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 40px auto; text-align: center;">
  <div class="card-body" style="padding: 40px 20px;">
    <div style="width: 64px; height: 64px; background: var(--warning-mist); color: var(--warning-deep); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 20px;">
      <i class="ph-bold ph-magnifying-glass"></i>
    </div>
    <h2 style="font-size: 20px; font-weight: 800; margin-bottom: 10px;">404 - Not Found</h2>
    <p class="text-slate text-sm mb-6">The page or resource you are looking for does not exist.</p>
    <a href="{{ url_for('auth_routes.login') }}" class="btn btn-primary">Return to Dashboard</a>
  </div>
</div>
{% endblock %}
