<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — MindCare</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js"></script>
  <style>
    :root {
      --lavender-deep: #7C6FCD;
      --lavender:      #A89CDE;
      --lavender-mist: #EDE9FA;
      --sky-deep:      #5EA5D6;
      --sky-mist:      #E0F3FB;
      --mist:          #F4F2FC;
      --cloud:         #FFFFFF;
      --ink:           #1F1B33;
      --ink-light:     #4A4666;
      --slate:         #6B7280;
      --divider:       #E5E3F0;
      --critical:      #DC2626;
      --critical-mist: #FEE2E2;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--mist);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      height: 800px;
      max-height: 90vh;
      background: var(--mist);
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 24px 48px rgba(31, 27, 51, 0.1);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* ── Hero Blob Section (Top 40%) ── */
    .hero-section {
      flex: 0 0 40%;
      background: linear-gradient(145deg, #5A4FB8 0%, #7C6FCD 45%, #5EA5D6 100%);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated Blob Elements */
    .hero-section::before {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      background: rgba(255,255,255,0.06);
      top: -100px; right: -100px;
      animation: morph 8s ease-in-out infinite;
    }
    .hero-section::after {
      content: '';
      position: absolute;
      width: 300px; height: 300px;
      border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
      background: rgba(255,255,255,0.06);
      bottom: -80px; left: -60px;
      animation: morph 6s ease-in-out infinite reverse;
    }

    @keyframes morph {
      0%, 100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
      34% { border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%; }
      67% { border-radius: 100% 60% 60% 100% / 100% 100% 60% 60%; }
    }

    /* Heartbeat glowing logo */
    .logo-container {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      border: 1.5px solid rgba(255,255,255,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(124,111,205,0.3);
      position: relative;
      z-index: 2;
    }
    .logo-container i {
      font-size: 48px;
      color: white;
    }

    /* ── Form Section (Bottom 60%) ── */
    .form-section {
      flex: 1;
      background: var(--cloud);
      border-radius: 32px 32px 0 0;
      margin-top: -32px; /* Overlap the hero section */
      position: relative;
      z-index: 3;
      padding: 32px;
      display: flex;
      flex-direction: column;
    }

    h1 { font-size: 24px; font-weight: 800; color: var(--ink); margin-bottom: 4px; letter-spacing: -0.5px; }
    .sub { font-size: 14px; color: var(--slate); margin-bottom: 24px; }

    .error-box {
      background: var(--critical-mist); color: var(--critical);
      padding: 12px 16px; border-radius: 12px;
      font-size: 13px; font-weight: 600;
      margin-bottom: 20px;
      display: flex; align-items: center; gap: 8px;
    }

    .form-group { margin-bottom: 16px; position: relative; }
    .form-label { display: block; font-size: 12px; font-weight: 700; color: var(--ink-light); margin-bottom: 6px; letter-spacing: 0.3px; }
    
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 16px;
      color: var(--slate);
      font-size: 20px;
      pointer-events: none;
    }
    .form-input {
      width: 100%; 
      padding: 14px 16px 14px 44px;
      border-radius: 16px; 
      border: 1.5px solid var(--divider);
      background: var(--mist);
      font-family: inherit; font-size: 15px; color: var(--ink);
      outline: none; transition: all 0.2s;
    }
    .form-input:focus {
      background: var(--cloud);
      border-color: var(--lavender-deep);
      box-shadow: 0 0 0 4px rgba(124,111,205,0.1);
    }

    .btn-login {
      width: 100%; padding: 16px;
      background: var(--lavender-deep); color: white;
      border: none; border-radius: 999px; /* Pill button */
      font-family: inherit; font-size: 16px; font-weight: 700;
      cursor: pointer; margin-top: 12px;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 8px 24px rgba(124,111,205,0.25);
    }
    .btn-login:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 12px 28px rgba(124,111,205,0.35);
    }
    .btn-login:active {
      transform: translateY(0);
    }

    .footer-note {
      margin-top: auto;
      text-align: center;
      font-size: 12px;
      color: var(--slate);
    }
  </style>
</head>
<body>

  <div class="login-container">
    
    <!-- Top Hero Section (40%) -->
    <div class="hero-section">
      <div class="logo-container">
        <i class="ph-bold ph-heartbeat"></i>
      </div>
    </div>

    <!-- Bottom Form Section (60%) -->
    <div class="form-section">
      <h1>Welcome back</h1>
      <p class="sub">Sign in to continue</p>

      {% if error %}
      <div class="error-box">
        <i class="ph-bold ph-warning-circle"></i> {{ error }}
      </div>
      {% endif %}

      <form method="POST" id="login-form">
        <div class="form-group">
          <label class="form-label">Email</label>
          <div class="input-wrapper">
            <i class="ph-duotone ph-envelope input-icon"></i>
            <input type="email" name="email" class="form-input" required autofocus
                   placeholder="your@email.com"
                   value="{{ request.form.get('email', '') }}" />
          </div>
        </div>
        
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrapper">
            <i class="ph-duotone ph-lock input-icon"></i>
            <input type="password" name="password" class="form-input" required
                   placeholder="••••••••" />
          </div>
        </div>

        <button type="submit" class="btn-login" id="login-btn">
          Sign In
        </button>
      </form>

      <div class="footer-note">
        Access is managed by your healthcare provider
      </div>
    </div>

  </div>

</body>
</html>
