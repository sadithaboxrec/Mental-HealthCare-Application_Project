<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mental Health Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; }
    nav {
      background: #2c3e50; padding: 14px 30px;
      display: flex; gap: 16px; align-items: center;
    }
    nav .brand { color: white; font-size: 18px; font-weight: bold; margin-right: auto; }
    nav a {
      color: #ecf0f1; text-decoration: none;
      padding: 6px 14px; border-radius: 4px; font-size: 14px;
    }
    nav a:hover { background: #34495e; }
    .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    .card {
      background: white; border-radius: 8px;
      padding: 28px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 24px;
    }
    h1 { font-size: 20px; color: #2c3e50; margin-bottom: 20px; }
    h2 { font-size: 16px; color: #2c3e50; margin-bottom: 12px; }
    label { display: block; font-size: 13px; color: #555; margin: 12px 0 4px; }
    input, select {
      width: 100%; padding: 10px 12px; border: 1px solid #ccc;
      border-radius: 5px; font-size: 14px;
    }
    input:focus, select:focus { outline: none; border-color: #2980b9; }
    .btn {
      display: inline-block; padding: 10px 20px; border: none;
      border-radius: 5px; cursor: pointer; font-size: 14px;
      text-decoration: none;
    }
    .btn-primary { background: #2980b9; color: white; }
    .btn-primary:hover { background: #2471a3; }
    .btn-success { background: #27ae60; color: white; }
    .btn-success:hover { background: #219a52; }
    .btn-full { width: 100%; margin-top: 16px; }
    .msg { margin-top: 14px; padding: 10px 14px; border-radius: 5px; display: none; font-size: 13px; }
    .msg.success { background: #d4edda; color: #155724; }
    .msg.error   { background: #f8d7da; color: #721c24; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #e0e0e0; padding: 10px 12px; text-align: left; font-size: 13px; }
    th { background: #f7f7f7; font-weight: 600; }
    tr:hover td { background: #fafafa; }
    .badge {
      display: inline-block; padding: 2px 10px;
      border-radius: 10px; font-size: 11px; font-weight: bold;
    }
    .badge-doctor    { background: #d6eaf8; color: #1a5276; }
    .badge-patient   { background: #d5f5e3; color: #1e8449; }
    .badge-counselor { background: #f9ebea; color: #922b21; }
    .badge-guardian  { background: #fef9e7; color: #7d6608; }
    .guardian-box {
      background: #fafafa; border: 1px solid #e0e0e0;
      border-radius: 6px; padding: 12px; margin-top: 16px; display: none;
    }
    .stat-row { display: flex; gap: 16px; margin-bottom: 24px; }
    .stat-card {
      flex: 1; background: white; border-radius: 8px;
      padding: 20px; text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .stat-card .num { font-size: 32px; font-weight: bold; color: #2c3e50; }
    .stat-card .lbl { font-size: 13px; color: #888; margin-top: 4px; }
  </style>
</head>
<body>
  <nav>
    <span class="brand">🏥 Mental Health Admin</span>
    <a href="/">Dashboard</a>
    <a href="/doctors">Doctors</a>
    <a href="/counselors">Counselors</a>
    <a href="/patients">Patients</a>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
