{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Assign / Reassign Doctor</h1>

  <label>Select Patient</label>
  <select id="patientUid">
    <option value="">-- Select Patient --</option>
    {% for p in patients %}
    <option value="{{ p.uid }}">{{ p.name }} ({{ p.email }})</option>
    {% endfor %}
  </select>

  <label>Select Doctor</label>
  <select id="doctorUid">
    <option value="">-- Select Doctor --</option>
    {% for d in doctors %}
    <option value="{{ d.uid }}">{{ d.name }} ({{ d.email }})</option>
    {% endfor %}
  </select>

  <button class="btn btn-primary btn-full" onclick="assign()">
    Assign Doctor
  </button>
  <div id="msg" class="msg"></div>
</div>

<script>
async function assign() {
  const payload = {
    patientUid: document.getElementById("patientUid").value,
    doctorUid:  document.getElementById("doctorUid").value,
  };
  const msg = document.getElementById("msg");
  const res = await fetch("/assign-doctor", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  msg.style.display = "block";
  if (res.ok) {
    msg.className = "msg success";
    msg.textContent = "✅ Doctor assigned successfully";
  } else {
    msg.className = "msg error";
    msg.textContent = "❌ " + data.error;
  }
}
</script>
{% endblock %}
