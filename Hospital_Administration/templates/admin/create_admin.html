{% extends "base.html" %}
{% block title %}Add Admin — MindCare Super Admin{% endblock %}
{% block page_title %}Add Administrator{% endblock %}
{% block breadcrumb %}Create a new platform manager account{% endblock %}

{% block content %}
<div class="max-w-2xl">
  <div class="card p-8">
    <form id="create-admin-form" class="space-y-6">
      <div class="grid grid-cols-2 gap-6">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" name="name" class="form-input" required placeholder="e.g. Jane Doe" />
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="text" name="phone" class="form-input" required placeholder="+1 234 567 8900" />
        </div>
      </div>
      
      <div class="grid grid-cols-2 gap-6">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" name="email" class="form-input" required placeholder="admin@mindcare.org" />
        </div>
        <div class="form-group">
          <label class="form-label">Temporary Password</label>
          <input type="password" name="password" class="form-input" required placeholder="Min 6 characters" minlength="6" />
        </div>
      </div>

      <div class="flex items-center gap-4 pt-4 border-t border-divider">
        <button type="submit" class="btn btn-primary" id="submit-btn">
          <i class="ph-bold ph-check"></i> Create Administrator
        </button>
        <a href="{{ url_for('admin_routes.admins') }}" class="btn" style="background: var(--mist); color: var(--ink);">Cancel</a>
      </div>
    </form>
    
    <div id="status-msg" class="mt-4 text-sm font-semibold hidden"></div>
  </div>
</div>

<script>
document.getElementById('create-admin-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  const msg = document.getElementById('status-msg');
  const formData = new FormData(e.target);
  const data = Object.fromEntries(formData.entries());

  btn.disabled = true;
  btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i> Creating...';
  msg.className = 'mt-4 text-sm font-semibold hidden';

  try {
    const res = await fetch('{{ url_for("admin_routes.create_admin") }}', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    
    const result = await res.json();
    if (res.ok) {
      msg.textContent = 'Administrator created successfully! Redirecting...';
      msg.className = 'mt-4 text-sm font-semibold text-[var(--sky-deep)] block';
      setTimeout(() => window.location.href = '{{ url_for("admin_routes.admins") }}', 1000);
    } else {
      throw new Error(result.error || 'Failed to create administrator');
    }
  } catch (err) {
    msg.textContent = 'Error: ' + err.message;
    msg.className = 'mt-4 text-sm font-semibold text-[var(--critical)] block';
    btn.disabled = false;
    btn.innerHTML = '<i class="ph-bold ph-check"></i> Create Administrator';
  }
});
</script>
{% endblock %}
